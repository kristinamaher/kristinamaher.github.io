<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="create, manage, update income">
    <meta name="keywords" content="personal income">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget- Income</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/mediaStyle.css">
	<link rel="stylesheet" href="css/classStyle.css">
</head>

<body>
    <header>
       <nav>
        <div>
            <a href="home.html"><img src="image/logo.png" alt="My Budget Finance Logo"   data-translate-alt="nav.logoAlt"></a>
            <p data-translate="nav.brand">My Budget</p>
        </div>

        <ul>
			<li><a href="home.html" data-translate="nav.home">Home</a></li>
			<li><a href="account.html" data-translate="nav.account">Account</a></li>
			<li><a href="goals.html" data-translate="nav.goals">Goals</a></li>
			<li><a href="income.html" data-translate="nav.income">Income</a></li>
			<li><a href="expenses.html" data-translate="nav.expenses">Expenses</a></li>
			<li><a href="summary.html" data-translate="nav.summary">Summary</a></li>
			<li><a href="settings.html" data-translate="nav.settings">Settings</a></li>
			<li><a href="about.html" data-translate="nav.about">About</a></li>
			<li><a href="home.html"><img src="image/home.png" alt="Home shortcut"  data-translate-alt="nav.homeAlt"></a></li>
            <li><a href="account.html"><img src="image/Account.png" alt="Account shortcut" data-translate-alt="nav.accountAlt"></a></li>
            <li><a href="settings.html"><img src="image/settings.png" alt="Settings shortcut" data-translate-alt="nav.settingsAlt"></a></li>
        </ul>
    </nav>
</header>
    <main>
		<h1 data-translate="income.title">Income</h1>

<section>
    <h2 data-translate="income.addIncome">Add Income</h2>

    <form id="income-form">
        <label for="income-source" data-translate="income.incomeSource">Income Source:</label>
        <input type="text" id="income-source" name="income-source">

        <label for="income-amount" data-translate="common.amount">Amount:</label>
        <input type="number" id="income-amount" name="income-amount" step="0.01">

        <label for="income-frequency" data-translate="frequency.amountFrequency">Frequency:</label>
        <select id="income-frequency" name="income-frequency">
            <option value="one-time" data-translate="frequency.oneTime">One-Time</option>
            <option value="weekly" data-translate="frequency.weekly">Weekly</option>
            <option value="biweekly" data-translate="frequency.biweekly">Biweekly</option>
            <option value="monthly" data-translate="frequency.monthly">Monthly</option>
            <option value="yearly" data-translate="frequency.yearly">Yearly</option>
        </select>

        <label for="income-date" data-translate="daytime.date">Date:</label>
        <input type="date" id="income-date" name="income-date">

        <button type="submit" data-translate="income.addIncome">Add Income</button>
    </form>
</section>
        <section>
    <h2 data-translate="income.moneyGifts">Money Gifts</h2>

   <form id="gift-form">
        <label for="gift-source" data-translate="income.giftFrom">Gift From:</label>
        <input type="text" id="gift-source" name="gift-source">

        <label for="gift-amount" data-translate="common.amount">Amount:</label>
        <input type="number" id="gift-amount" name="gift-amount" step="0.01">

        <label for="gift-date" data-translate="daytime.date">Date:</label>
        <input type="date" id="gift-date" name="gift-date">

        <button type="submit" data-translate="income.addMoneyGift">Add Money Gift</button>
    </form>
</section>
        <section>
    <h2 data-translate="income.giftPrepaidCard">Gift And Prepaid Cards</h2>

   <form id="card-form">
        <label for="card-name" data-translate="income.cardName">Card Name:</label>
        <input type="text" id="card-name" name="card-name">

        <label for="card-balance" data-translate="common.balance">Balance:</label>
        <input type="number" id="card-balance" name="card-balance" step="0.01">

        <label for="card-expiration" data-translate="income.expirationDate">Expiration Date:</label>
        <input type="date" id="card-expiration" name="card-expiration">

        <label for="card-notes" data-translate="common.notes">Notes:</label>
        <textarea id="card-notes" name="card-notes"></textarea>

        <button type="submit" data-translate="income.addCard">Add Card</button>
    </form>
</section>
 
    <section>
    <h2 data-translate="income.spendableFunds">Spendable Funds Overview</h2>

    <span data-translate="income.title">Income</span>: <span id="income-total">$0.00</span>
    <span data-translate="income.moneyGifts">Money Gifts</span>: <span id="gift-total">$0.00</span>
    <span data-translate="income.giftPrepaidCard">Gift and Prepaid Cards</span>: <span id="card-total">$0.00</span>

    <p>
        <strong data-translate="income.spendableIncome">Spendable Funds: <span id="spendable-total">$0.00</span></strong>
    </p>
</section>
    </main>
    <script src="js/script/translation.js"></script>
    <script src="js/script/income.js"></script>
</body>
</html>
