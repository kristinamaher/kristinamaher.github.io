<!DOCTYPE html>
<html lang ="en" data-current-language="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="Manage, update, and modify settings and security">
	<meta name="keywords" content="settings and security">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Budget - Settings </title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/mediaStyle.css">
	<link rel="stylesheet" href="css/classStyle.css">
</head>

<body>
    <header>
	     <nav>
        <div>
            <a href="home.html"><img src="image/logo.png" alt="My Budget Finance Logo"   data-translate-alt="nav.logoAlt"></a>
            <p data-translate="nav.brand">My Budget</p>
        </div>

        <ul>
			<li><a href="home.html" data-translate="nav.home">Home</a></li>
			<li><a href="account.html" data-translate="nav.account">Account</a></li>
			<li><a href="goals.html" data-translate="nav.goals">Goals</a></li>
			<li><a href="income.html" data-translate="nav.income">Income</a></li>
			<li><a href="expenses.html" data-translate="nav.expenses">Expenses</a></li>
			<li><a href="summary.html" data-translate="nav.summary">Summary</a></li>
			<li><a href="settings.html" data-translate="nav.settings">Settings</a></li>
			<li><a href="about.html" data-translate="nav.about">About</a></li>
			<li><a href="home.html"><img src="image/home.png" alt="Home shortcut"  data-translate-alt="nav.homeAlt"></a></li>
            <li><a href="account.html"><img src="image/Account.png" alt="Account shortcut" data-translate-alt="nav.accountAlt"></a></li>
            <li><a href="settings.html"><img src="image/settings.png" alt="Settings shortcut" data-translate-alt="nav.settingsAlt"></a></li>
        </ul>
    </nav>
</header>
  <main>

    <h1 data-translate="settings.title">Settings</h1>

<section>
    <h2 data-translate="settings.notifications">Notification Preferences</h2>

    <form id="notification-form">
        <label>
            <input type="checkbox" name="budget-alerts">
            <span data-translate="settings.budgetAlerts">Budget alerts</span>
        </label>

        <label>
            <input type="checkbox" name="goal-reminders">
            <span data-translate="settings.goalReminders">Goal reminders</span>
        </label>

        <label>
            <input type="checkbox" name="monthly-summary">
            <span data-translate="settings.monthlySummary">Monthly financial summary</span>
        </label>

        <button type="submit">
    		<span data-translate="settings.saveNotifications">Save Notification Preferences</span>
		</button>
    </form>
</section>
	  <section>
<h2 data-translate="language.language">Language Preferences</h2>

    <form id="language-form">
        <label for="language">
    		<span data-translate="language.website">Website Language:</span>
		</label>

        <select id="language" name="language">
            <option value="en">English</option>
            <option value="ja">日本語 (Japanese)</option>
        </select>

        <button type="submit">
    		<span data-translate="language.save">Save Language Preference</span>
		</button>
    </form>
</section>

	  <section>
		<h2 data-translate="settings.security">Security Settings</h2>
   
    <form id="security-form">
        <label for="two-factor">
            <input type="checkbox" id="two-factor" name="two-factor">
            <span data-translate="settings.twoFactor">Two-factor authentication</span>
        </label>

        <label for="login-alerts">
            <input type="checkbox" id="login-alerts" name="login-alerts">
			<span data-translate="settings.loginAlerts">Login alerts</span>
            
        </label>

    		<button type="submit">
    			<span data-translate="settings.saveSecurity">Save Security Settings</span>
			</button>
    </form>
</section>

	  <section>
    <h2 data-translate="settings.display">Display Preferences</h2>

    <form id="display-form">
       <label for="theme">
    		<span data-translate="settings.theme">Theme:</span>
		</label>
        <select id="theme" name="theme">
            <option value="light" data-translate="settings.light">Light</option>
            <option value="dark" data-translate="settings.dark">Dark</option>
        </select>

        <label for="layout">
    		<span data-translate="settings.layout">Layout:</span>
		</label>
        <select id="layout" name="layout">
            <option value="comfortable" data-translate="settings.comfortable">Comfortable</option>
            <option value="compact" data-translate="settings.compact">Compact</option>
        </select>

      	<label>
    	<input type="checkbox" name="dashboard-info">
    	<span data-translate="settings.dashboardInfo">Show financial information on dashboard</span>
		</label>

		<button type="submit">
    		<span data-translate="settings.saveDisplay">Save Display Preferences</span>
		</button>
    </form>
</section>

<section>
    <h2 data-translate="daytime.daytime">Date and Time</h2>

    <form id="date-time-form">
        <label for="date-format">
            <span data-translate="daytime.dateFormat">Date Format:</span>
        </label>
        <select id="date-format" name="date-format">
            <option value="mm-dd-yyyy" data-translate="daytime.dateMMDD">MM-DD-YYYY</option>
            <option value="dd-mm-yyyy" data-translate="daytime.dateDDMM">DD-MM-YYYY</option>
            <option value="yyyy-mm-dd" data-translate="daytime.dateYYYYMM">YYYY-MM-DD</option>
        </select>

        <label for="time-format">
            <span data-translate="daytime.timeFormat">Time Format:</span>
        </label>
        <select id="time-format" name="time-format">
            <option value="24-hour" data-translate="daytime.time24">24 Hour Time</option>
            <option value="12-hour" data-translate="daytime.time12">12 Hour Time</option>
        </select>

        <label for="timezone">
            <span data-translate="daytime.timezone">Time Zone:</span>
        </label>
        <select id="timezone" name="timezone">
            <option value="local" data-translate="daytime.localTime">Use Local Time</option>
            <option value="jst" data-translate="daytime.jst">JST</option>
			<option value="mst" data-translate="daytime.mst">MST</option>
			<option value="mdt" data-translate="daytime.mdt">MDT</option>
			<option value="utc" data-translate="daytime.utc">UTC</option>
	
        </select>

        <label for="week-start">
            <span data-translate="week.weekStart">First Day of the Week:</span>
        </label>
        <select id="week-start" name="week-start">
            <option value="sunday" data-translate="week.sunday">Sunday</option>
            <option value="monday" data-translate="week.monday">Monday</option>
        </select>

        <button type="submit">
            <span data-translate="daytime.saveDateTime">Save Date and Time Settings</span>
        </button>
    </form>
</section>

<section>
    <h2 data-translate="settings.privacy">Privacy</h2>

    <form id="privacy-form">
        <label>
            <input type="checkbox" name="hide-name">
            <span data-translate="settings.hideName">Hide name on dashboard</span>
        </label>

        <label>
            <input type="checkbox" name="hide-gifts">
            <span data-translate="settings.hideGifts">Hide gifts from dashboard</span>
        </label>

        <button type="submit">
            <span data-translate="settings.savePrivacy">Save Privacy Settings</span>
        </button>
    </form>
</section>

<section>
    <h2 data-translate="settings.budget">Budget Preferences</h2>

    <form id="budget-preferences-form">
        <label for="budget-period">
            <span data-translate="settings.budgetPeriod">Default Budget Period:</span>
        </label>

        <select id="budget-period" name="budget-period">
            <option value="weekly" data-translate="frequency.weekly">Weekly</option>
            <option value="monthly" data-translate="frequency.monthly">Monthly</option>
        </select>

        <label for="budget-warning">
            <span data-translate="settings.budgetWarning">Budget Warning Threshold:</span>
        </label>

        <select id="budget-warning" name="budget-warning">
            <option value="50">50%</option>
            <option value="75">75%</option>
            <option value="80">80%</option>
            <option value="90">90%</option>
        </select>

        <button type="submit">
            <span data-translate="settings.saveBudget">Save Budget Preferences</span>
        </button>
    </form>
</section>

    </main>
	<script src="js/translation/mainTranslation.js.js"></script>
	 <script src="js/script/settings.js"></script>
</body>
</html>
