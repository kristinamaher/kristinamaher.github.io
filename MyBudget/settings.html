<!DOCTYPE html>
<html lang ="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="Manage, update, and modify settings and security">
	<meta name="keywords" content="settings and security">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Budget - Settings </title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
          <nav>
            <ul>
                <li><a href="index.html"><img src="image/home.png" alt="home shortcut"></a></li>
                <li><a href="account.html"><img src="image/Account.png" alt="account shortcut"></a></li>
                <li><a href="goals.html">Goals</a></li>
                <li><a href="index.html">About</a></li>
                <li><a href="settings.html"><img src="image/settings.png" alt="Settings"></a></li>
            </ul>
        </nav>
    </header>
  <main>

        <h1>Settings</h1>

<section>
    <h2>Notification Preferences</h2>

    <form>
        <label>
            <input type="checkbox" name="budget-alerts">
            Budget alerts
        </label>

        <label>
            <input type="checkbox" name="goal-reminders">
            Goal reminders
        </label>

        <label>
            <input type="checkbox" name="monthly-summary">
            Monthly financial summary
        </label>

        <button type="submit">Save Notification Preferences</button>
    </form>
</section>

	  <section>
    <h2>Security Settings</h2>

    <form>
        <label for="two-factor">
            <input type="checkbox" id="two-factor" name="two-factor">
            Two-factor authentication
        </label>

        <label for="login-alerts">
            <input type="checkbox" id="login-alerts" name="login-alerts">
            Login alerts
        </label>

        <button type="submit">Save Security Settings</button>
    </form>
</section>

	  <section>
    <h2>Display Preferences</h2>

    <form>
        <label for="theme">Theme:</label>
        <select id="theme" name="theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>

        <label for="layout">Layout:</label>
        <select id="layout" name="layout">
            <option value="comfortable">Comfortable</option>
            <option value="compact">Compact</option>
        </select>

        <label>
            <input type="checkbox" name="dashboard-info">
            Show financial information on dashboard
        </label>

        <button type="submit">Save Display Preferences</button>
    </form>
</section>

<section>
    <h2>Date &amp; Time</h2>

    <form>
        <label for="date-format">Date Format:</label>
        <select id="date-format" name="date-format">
            <option value="mm-dd-yyyy">MM-DD-YYYY</option>
            <option value="dd-mm-yyyy">DD-MM-YYYY</option>
            <option value="yyyy-mm-dd">YYYY-MM-DD</option>
        </select>

        <label for="timezone">Time Zone:</label>
        <select id="timezone" name="timezone">
            <option value="local">Use Local Time</option>
            <option value="utc">UTC</option>
        </select>

        <label for="week-start">First Day of the Week:</label>
        <select id="week-start" name="week-start">
            <option value="sunday">Sunday</option>
            <option value="monday">Monday</option>
        </select>

        <button type="submit">Save Date &amp; Time Settings</button>
    </form>
</section>

<section>
    <h2>Privacy</h2>

    <form>
        <label>
            <input type="checkbox" name="hide-balances">
            Hide account balances by default
        </label>

        <label>
            <input type="checkbox" name="hide-amounts">
            Hide financial amounts on dashboard
        </label>

        <button type="submit">Save Privacy Settings</button>
    </form>
</section>

<section>
    <h2>Budget Preferences</h2>

    <form>
        <label for="budget-period">Default Budget Period:</label>
        <select id="budget-period" name="budget-period">
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
        </select>

        <label for="budget-warning">Budget Warning Threshold:</label>
        <select id="budget-warning" name="budget-warning">
            <option value="50">50%</option>
            <option value="75">75%</option>
            <option value="80">80%</option>
            <option value="90">90%</option>
        </select>

        <button type="submit">Save Budget Preferences</button>
    </form>
</section>
    </main>
	    <script src="js/script/main.js"></script>
	 <script src="js/script/settings.js"></script>
</body>
</html>
