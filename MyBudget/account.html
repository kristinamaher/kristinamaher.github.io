<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="create, manage, your personal account">
    <meta name="keywords" content="your personal information, and account preferences">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget - Account</title>
    	<link rel="stylesheet" href="css/style.css">
		<link rel="stylesheet" href="css/classStyle.css">
	<link rel="stylesheet" href="css/mediaStyle.css">
</head>

<body>
    <header>
       <nav>
        <div>
            <a href="home.html"><img src="image/logo.png" alt="My Budget Finance Logo"   data-translate-alt="nav.logoAlt"></a>
            <p data-translate="nav.brand">My Budget</p>
        </div>

        <ul>
			<li><a href="home.html" data-translate="nav.home">Home</a></li>
			<li><a href="account.html" data-translate="nav.account">Account</a></li>
			<li><a href="goals.html" data-translate="nav.goals">Goals</a></li>
			<li><a href="income.html" data-translate="nav.income">Income</a></li>
			<li><a href="expenses.html" data-translate="nav.expenses">Expenses</a></li>
			<li><a href="summary.html" data-translate="nav.summary">Summary</a></li>
			<li><a href="settings.html" data-translate="nav.settings">Settings</a></li>
			<li><a href="about.html" data-translate="nav.about">About</a></li>
			<li><a href="home.html"><img src="image/home.png" alt="Home shortcut" data-translate-alt="nav.homeAlt"></a></li>
            <li><a href="account.html"><img src="image/Account.png" alt="Account shortcut" data-translate-alt="nav.accountAlt"></a></li>
            <li><a href="settings.html"><img src="image/settings.png" alt="Settings shortcut" data-translate-alt="nav.settingsAlt"></a></li>
        </ul>
    </nav>
</header>

    <main>
		<h1 data-translate="account.title">Account</h1>
    
		<section>
   <h2 data-translate="account.createAccount">Create Account</h2>

    <form id="create-account-form">

        <label for="create-username" data-translate="account.username">Username:</label>
        <input
            type="text"
            id="create-username"
            name="create-username"
        >

        <label for="create-email" data-translate="account.email">Email Address:</label>
        <input
            type="email"
            id="create-email"
            name="create-email"
        >

        <label for="create-password" data-translate="account.password">Password:</label>
        <input
            type="password"
            id="create-password"
            name="create-password"
        >

        <label for="create-confirm-password" data-translate="account.confirmPassword">
            Confirm Password:
        </label>

        <input
            type="password"
            id="create-confirm-password"
            name="create-confirm-password"
        >

        <button type="submit" data-translate="account.createAccount">
            Create Account
        </button>

    </form>
</section>

        <section>
            <h2 data-translate="account.login">Login</h2>

           <form id="login-information-form">
                <label for="username" data-translate="account.username">Username:</label>
                <input type="text" id="username" name="username">

                <label for="email"  data-translate="account.email">Email Address:</label>
                <input type="email" id="email" name="email">

                <label for="password"  data-translate="account.password">Password:</label>
                <input type="password" id="password" name="password">

                <label for="confirm-password"  data-translate="account.confirmPassword">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password">

                <button type="submit"  data-translate="account.login">Login</button>
            </form>
        </section>

        <section>
            <h2  data-translate="account.personalinformation">Personal Information</h2>

            <form id="personal-information-form">
                <label for="first-name"  data-translate="account.firstName">First Name:</label>
                <input type="text" id="first-name" name="first-name">

                <label for="last-name"  data-translate="account.lastName">Last Name:</label>
                <input type="text" id="last-name" name="last-name">

                <label for="phone"  data-translate="account.phoneNumber">Phone Number:</label>
                <input type="tel" id="phone" name="phone">

                <label for="country"  data-translate="country.countryRegion">Country/Region:</label>
                <select id="country" name="country">
					 <option value="au"  data-translate="country.australia">Australia</option>
                   
                    <option value="ca"  data-translate="country.canada">Canada</option>
					<option value="jp"  data-translate="country.japan">Japan</option>
					<option value="uae"  data-translate="country.unitedArabEmirates">United Arab Emirates</option>
                    <option value="uk"  data-translate="country.unitedKingdom">United Kingdom</option>
                    <option value="us"  data-translate="country.unitedStates">United States</option>
					
                    <option value="other" data-translate="common.other">Other</option>
                </select>

                <button type="submit" data-translate="account.savepersonal">Save Personal Information</button>
            </form>
        </section>

        <section>
            <h2 data-translate="currency.currencyPreference">Currency Preference</h2>

            <form id="currency-form">
                <label for="currency" data-translate="currency.preferredCurrency">Preferred Currency:</label>

                <select id="currency" name="currency">
                    <option value="usd" data-translate="currency.usdollar">US Dollar ($)</option>
                    <option value="eur" data-translate="currency.euro">Euro (€)</option>
                    <option value="gbp" data-translate="currency.birtishPound">British Pound (£)</option>
                    <option value="jpy"data-translate="currency.japaneseYen">Japanese Yen (¥)</option>
                    <option value="cad" data-translate="currency.canadianDollar">Canadian Dollar (C$)</option>
                    <option value="aud" data-translate="currency.australianDollar">Australian Dollar (A$)</option>
                    <option value="chf" data-translate="currency.swissFranc">Swiss Franc (CHF)</option>
                    <option value="cny" data-translate="currency.chineseYuan">Chinese Yuan (¥)</option>
                    <option value="inr" data-translate="currency.indianRupee">Indian Rupee (₹)</option>
                    <option value="mxn" data-translate="currency.mexicanPeso">Mexican Peso ($)</option>
                </select>

                <label for="travel-mode">
                    <input type="checkbox" id="travel-mode" name="travel-mode">
                   <span data-translate="account.travelInternational"> international Travel </span>
                </label>

                <button type="submit" data-translate="account.saveCurrencyPreferences">Save Currency Preference</button>
            </form>
        </section>

        <section>
    <h2 data-translate="account.profilePicture">Profile Picture</h2>

    <form id="profile-picture-form">

        <label>
            <input
                type="radio"
                name="picture-option"
                value="default"
                checked
            >
            <span data-translate="account.displayDefaultPicture">Display Default Picture</span>
        </label>

        <label>
            <input
                type="radio"
                name="picture-option"
                value="custom"
            >
            <span data-translate="account.useUploadedPicture">Use Uploaded Picture</span>
        </label>

        <br>

        <label for="profile-picture">
            <span data-translate="account.choosePicture">Choose a profile picture:</span>
        </label>

        <input
            type="file"
            id="profile-picture"
            name="profile-picture"
            accept="image/*"
        >

        <button type="submit" data-translate="account.savePicture">
            Save Profile Picture
        </button>

    </form>
</section>

        <section>
            <h2 data-translate="account.accountManagement">Account Management</h2>

            <form>
                <button type="submit" id="logout-button" data-translate="account.logout">Log Out</button>
            </form>
			
			<form>
           <button type="submit" id="deactivate-button" data-translate="account.deactivateAccount">Deactivate Account</button>
			</form>
			
            <form>
                <button type="submit" id="delete-account-button"data-translate="account.deleteAccount">Delete Account</button>
            </form>
        </section>

    </main>
   <script src="js/script/translation.js"></script>
    <script src="js/script/account.js"></script>

</body>
</html>
