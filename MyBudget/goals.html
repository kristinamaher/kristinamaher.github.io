<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="Add, edit, review all current and past goals">
    <meta name="keywords" content="goal setting and goal trends">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget - Goals</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/classStyle.css">
	<link rel="stylesheet" href="css/mediaStyle.css">
</head>

<body>

    <header>
       <nav>
        <div>
            <a href="home.html"><img src="image/logo.png" alt="My Budget Finance Logo"   data-translate-alt="nav.logoAlt"></a>
            <p data-translate="nav.brand">My Budget</p>
        </div>

        <ul>
			<li><a href="home.html" data-translate="nav.home">Home</a></li>
			<li><a href="account.html" data-translate="nav.account">Account</a></li>
			<li><a href="goals.html" data-translate="nav.goals">Goals</a></li>
			<li><a href="income.html" data-translate="nav.income">Income</a></li>
			<li><a href="expenses.html" data-translate="nav.expenses">Expenses</a></li>
			<li><a href="summary.html" data-translate="nav.summary">Summary</a></li>
			<li><a href="settings.html" data-translate="nav.settings">Settings</a></li>
			<li><a href="about.html" data-translate="nav.about">About</a></li>
			<li><a href="home.html"><img src="image/home.png" alt="Home shortcut" data-translate-alt="nav.homeAlt"></a></li>
            <li><a href="account.html"><img src="image/Account.png" alt="Account shortcut" data-translate-alt="nav.accountAlt"></a></li>
            <li><a href="settings.html"><img src="image/settings.png" alt="Settings shortcut" data-translate-alt="nav.settingsAlt"></a></li>
        </ul>
    </nav>
</header>

    <main>
		<h1 data-translate="goals.title">Goals</h1>

        <section>
            <h2 data-translate="goals.addGgoal">Add a Goal</h2>

            <form id="goal-form">

                <label for="goal-name" data-translate="goals.name">Goal Name:</label>
                <input type="text" id="goal-name" name="goal-name">

                <label for="goal-type" data-translate="type.title">Goal Type:</label>
                <select id="goal-type" name="goal-type">
                    <option value="savings" data-translate="type.savings">Savings</option>
                    <option value="spending" data-translate="type.spending">Spending</option>
                    <option value="debt" data-translate="type.debt">Debt</option>
                    <option value="investment" data-translate="type.investment">Investment</option>
					<option value="other" data-translate="common.other">Other</option>
                </select>

                <label for="custom-type" data-translate="type.custom">Custom Goal Type:</label>
                <input
                    type="text"
                    id="custom-type"
                    name="custom-type"
                    placeholder="Enter your own type" data-translate="type.placeholder"
                >

                <label for="goal-category" data-translate="category.title">Category:</label>
                <select id="goal-category" name="goal-category">
                    <option value="emergency" data-translate="category.emergencyFund">Emergency Fund</option>
                    <option value="housing" data-translate="category.housing">Housing</option>
                    <option value="vehicle" data-translate="category.vehicle">Vehicle</option>
                    <option value="education" data-translate="category.education">Education</option>
                    <option value="travel" data-translate="category.travel">Travel</option>
                    <option value="retirement" data-translate="category.retirement">Retirement</option>
                    <option value="other" data-translate="common.other">Other</option>
                </select>

                <label for="custom-category" data-translate="goals.customCategory">Custom Category:</label>
                <input
                    type="text"
                    id="custom-category"
                    name="custom-category"
                    placeholder="Enter your own category" data-translate="goals.categoryPlaceholder"
                >

                <label for="goal-priority" data-translate="priority.title">Priority:</label>
                <select id="goal-priority" name="goal-priority">
                    <option value="high" data-translate="priority.high">High</option>
                    <option value="medium" data-translate="priority.medium">Medium</option>
                    <option value="low" data-translate="priority.low">Low</option>
                    <option value="other" data-translate="common.other">Other</option>
                </select>

                <label for="frequency" data-translate="goal.frequency">How Often:</label>
                <select id="frequency" name="frequency">
                    <option value="" data-translate="goal.select">Select frequency</option>
                    <option value="daily" data-translate="frequency.daily">Daily</option>
                    <option value="weekly" data-translate="frequency.weekly">Weekly</option>
                    <option value="biweekly" data-translate="frequency.biweekly">Biweekly</option>
                    <option value="monthly" data-translate="frequency.monthly">Monthly</option>
                    <option value="yearly" data-translate="frequency.yearly">Yearly</option>
                    <option value="other" data-translate="common.other">Other</option>
                </select>

                <label for="custom-frequency" data-translate="goals.customFrequency">Custom Frequency Occurrence:</label>
                <input
                    type="text"
                    id="custom-frequency"
                    name="custom-frequency"
                    placeholder="Enter your own frequency" data-translate="goals.customPlaceholder"
                >

                <label for="goal-amount" data-translate="goals.goalAmount">Goal Amount:</label>
                <input
                    type="number"
                    id="goal-amount"
                    name="goal-amount"
                    step="0.01"
                >

                <label for="goal-progress" data-translate="goals.currentProgress">Current Progress:</label>
                <input
                    type="number"
                    id="goal-progress"
                    name="goal-progress"
                    step="0.01"
                >

                <label for="goal-date" data-translate="goals.targetDate">Target Date:</label>
                <input
                    type="date"
                    id="goal-date"
                    name="goal-date"
                >

                <label for="goal-notes" data-translate="common.notes">Notes:</label>
                <textarea
                    id="goal-notes"
                    name="goal-notes"
                ></textarea>

                <button type="submit">Add Goal</button>

            </form>
        </section>

                <section>
    <h2>Current Goals</h2>

    <div id="current-goals">
        <p id="no-current-goals">
            You haven't added any goals yet.
        </p>
    </div>
</section>

        <section>

            <h2>Past Goals</h2>

            <div id="past-goals">

                <div id="completed-goals">
                    <h3>Completed Goals</h3>
                </div>

                <div id="expired-goals">
                    <h3>Expired Goals</h3>
                </div>

            </div>

        </section>


        <section>

            <h2>Search Goals</h2>

            <fieldset>

                <legend>Search By</legend>

                <input
                    type="radio"
                    id="search-name"
                    name="searchBy"
                    value="name"
                >
                <label for="search-name">Goal Name</label>

                <input
                    type="radio"
                    id="search-type"
                    name="searchBy"
                    value="type"
                >
                <label for="search-type">Goal Type</label>

                <input
                    type="radio"
                    id="search-category"
                    name="searchBy"
                    value="category"
                >
                <label for="search-category">Category</label>

                <input
                    type="radio"
                    id="search-priority"
                    name="searchBy"
                    value="priority"
                >
                <label for="search-priority">Priority</label>

                <input
                    type="radio"
                    id="search-frequency"
                    name="searchBy"
                    value="frequency"
                >
                <label for="search-frequency">Frequency</label>

                <input
                    type="radio"
                    id="search-status"
                    name="searchBy"
                    value="status"
                >
                <label for="search-status">Status</label>

                <input
                    type="radio"
                    id="search-amount"
                    name="searchBy"
                    value="amount"
                >
                <label for="search-amount">Goal Amount</label>

                <input
                    type="radio"
                    id="search-date"
                    name="searchBy"
                    value="date"
                >
                <label for="search-date">Target Date</label>

            </fieldset>

            <label for="search-value">Search:</label>

            <input
                type="text"
                id="search-value"
                name="search-value"
            >

            <button
                type="button"
                id="search-goals-button"
            >
                Search
            </button>

            <label for="goal-status">Goal Status:</label>

            <select id="goal-status" name="goal-status">
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
                <option value="expired">Expired</option>
            </select>

        </section>

    </main>
<script src="js/translation/mainTranslation.js.js"></script>
    <script src="js/script/goals.js"></script>
</body>
</html>
